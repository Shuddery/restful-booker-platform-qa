services:

  # =========================================================================
  # ЧАСТЬ 1: ТЕСТОВАЯ ИНФРАСТРУКТУРА (CI/CD И БРАУЗЕРЫ)
  # =========================================================================

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-pet-project
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - qa_network

  selenoid:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/selenoid:ro
    environment:
      - DOCKER_API_VERSION=1.40
    command: ["-conf", "/etc/selenoid/browsers.json", "-limit", "4", "-video-output-dir", "/opt/selenoid/video/", "-container-network", "restful-booker-platform_qa_network"]
    networks:
      - qa_network

  selenoid-ui:
    image: aerokube/selenoid-ui:1.10.4
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - qa_network

  # =========================================================================
  # ЧАСТЬ 2: ТЕСТИРУЕМОЕ МИКРОСЕРВИСНОЕ ПРИЛОЖЕНИЕ (СБОРКА ИЗ ИСХОДНИКОВ)
  # =========================================================================

  rbp-assets:
    build:
      context: ./assets
      args:
        BOOKING_API: http://rbp-booking:3000
        ROOM_API: http://rbp-room:3001
        BRANDING_API: http://rbp-branding:3002
        AUTH_API: http://rbp-auth:3004
        REPORT_API: http://rbp-report:3005
        MESSAGE_API: http://rbp-message:3006
    container_name: rbp-assets
    ports:
      - "3003:80"
    environment:
      - BOOKING_API=http://rbp-booking:3000
      - ROOM_API=http://rbp-room:3001
      - BRANDING_API=http://rbp-branding:3002
      - AUTH_API=http://rbp-auth:3004
      - REPORT_API=http://rbp-report:3005
      - MESSAGE_API=http://rbp-message:3006
    restart: always
    networks:
      - qa_network


  rbp-room:
    build: ./room
    container_name: rbp-room
    ports:
      - "3001:3001"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://hotel-db:3306/hotel_db
      - DB_USER=qa_user
      - DB_PASSWORD=qa_password
    restart: always
    networks:
      - qa_network


  rbp-booking:
      build: ./booking
      container_name: rbp-booking
      ports:
        - "3000:3000"
      environment:
        - SPRING_PROFILES_ACTIVE=prod
        - DB_URL=jdbc:mysql://hotel-db:3306/hotel_db
        - DB_USER=qa_user
        - DB_PASSWORD=qa_password
      restart: always
      networks:
        - qa_network

  rbp-branding:
    build: ./branding
    container_name: rbp-branding
    ports:
      - "3002:3002"
    restart: always
    networks:
      - qa_network

  rbp-auth:
    build: ./auth
    container_name: rbp-auth
    ports:
      - "3004:3004"
    restart: always
    networks:
      - qa_network

  rbp-report:
    build: ./report
    container_name: rbp-report
    ports:
      - "3005:3005"
    restart: always
    networks:
      - qa_network

  rbp-message:
    build: ./message
    container_name: rbp-message
    ports:
      - "3006:3006"
    restart: always
    networks:
      - qa_network

  # =========================================================================
  # ЧАСТЬ 3: ОКРУЖЕНИЕ БЭКЕНДА (БД, ШИНА СООБЩЕНИЙ, МОКИ)
  # =========================================================================

  hotel-db:
    image: mysql:8.4
    container_name: hotel-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: 'hotel_db'
      MYSQL_USER: 'qa_user'
      MYSQL_PASSWORD: 'qa_password'
      MYSQL_ROOT_PASSWORD: 'root_pass'
    networks:
      - qa_network

  kafka:
    image: apache/kafka:4.1.2
    container_name: qa_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - qa_network

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: qa_kafka_ui
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'local-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
    networks:
      - qa_network
    depends_on:
      - kafka

  wiremock:
    image: wiremock/wiremock:3.5.4
    container_name: qa_wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--verbose"]
    networks:
      - qa_network

volumes:
  jenkins_home:

networks:
  qa_network:
    driver: bridge
